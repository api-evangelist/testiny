actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket or other server-push transport exists on Testiny's own API.
    The public surface is a documented request/response REST API with a live
    OpenAPI schema, and the MCP server runs over HTTP transport. No AsyncAPI
    document was created because there is nothing event-driven or bidirectional
    on Testiny's API to model.

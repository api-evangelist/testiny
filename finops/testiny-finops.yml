principles:
- name: Visibility
  description: Track active user seats and plan tier per account; monitor storage consumption against the plan quota.
- name: Allocation
  description: Map seats to teams/projects so subscription cost maps to internal cost centers.
- name: Optimization
  description: Right-size seat count, choose annual billing for the two-months-free discount, prune unused attachments to stay under storage quota, and consider self-hosted Testiny Server for large or regulated deployments.
- name: Accountability
  description: Assign an owner for the Testiny subscription; review seats and tier against actual QA team usage each billing cycle.

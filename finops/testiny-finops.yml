description: >-
  FinOps view of Testiny spend. Testiny is a per-seat SaaS: cost is driven by the
  number of user seats and the plan tier (Free up to 3 users, then Starter,
  Business, and Enterprise at published per-user monthly rates), not by API
  usage - the REST API, CLI, and npm package are included on every plan. The
  primary cost levers are seat count, plan tier, monthly-vs-annual billing
  (annual gives two months free), and storage consumed by attachments against
  each plan's quota. Custom Enterprise adds invoice-based billing and an
  on-premises self-hosting option (Testiny Server) whose cost shifts toward your
  own infrastructure.
notes: >-
  Per-user rates are on the pricing page and change over time; verify during
  reconciliation. There is no metered API charge - budget by seats and plan, and
  watch storage against plan quotas.

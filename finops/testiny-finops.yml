  unit: users
  aggregation: sum
  dimensions:
  - account
  - plan
- name: storage
  description: Attachment/blob storage consumed against the plan's storage quota.
  unit: bytes
  aggregation: max
  dimensions:
  - account
- name: plan_tier
  description: Subscription tier (Free, Starter, Business, Enterprise, Custom Enterprise) setting per-seat rate and included features.
  unit: tier
  aggregation: max
  dimensions:

aid: testiny
url: https://raw.githubusercontent.com/api-evangelist/testiny/refs/heads/main/apis.yml
name: Testiny
kind: company
description: Testiny is a modern test management platform for QA teams that keeps
  manual and automated test cases, test plans, test runs, and results in a single
  place, with reporting and integrations for Jira, GitLab, and GitHub. Everything in
  the product is backed by a documented REST API (base https://app.testiny.io/api/v1,
  authenticated with an X-Api-Key header) that exposes projects, test cases, test
  case folders, test plans, test runs, and automated test runs and results over a
  consistent CRUD/find/bulk/mapping pattern. Testiny publishes an OpenAPI schema at
  https://app.testiny.io/api/v1/swagger.json, ships a CLI and npm package
  (@testiny/cli), and offers an HTTP MCP server so AI assistants can manage test
  cases, runs, and results. Testiny is available as a hosted cloud service and, for
  Custom Enterprise, as self-hosted Testiny Server.
